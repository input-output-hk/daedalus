[package]
name = "drt"
version = "0.1.0"
edition = "2021"
description = "Daedalus release tool — hash, sign, upload installers; serve local update mirror"

[[bin]]
name = "drt"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Hashing
blake2 = "0.10"
sha2 = "0.10"
digest = "0.10"
hex = "0.4"

# S3
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-s3 = "1"
bytes = "1"

# HTTP (fetch-installers)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# HTTP server (serve command)
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tokio-util = { version = "0.7", features = ["io"] }

# Compression (APT Packages.gz, YUM primary.xml.gz, Arch DB)
flate2 = "1"

# Hashing (APT Packages needs MD5 + SHA1 in addition to SHA-256)
md5 = { package = "md-5", version = "0.10" }
sha1 = "0.10"

# Tar archive building (Arch .db.tar.gz)
tar = "0.4"

# Error handling + logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
