[package]
name = "cardano-watchdog"
version = "0.1.0"
edition = "2021"
description = "Independent process supervisor for cardano-node and cardano-wallet"

[[bin]]
name = "cardano-watchdog"
path = "src/main.rs"

[[bin]]
name = "mock-node"
path = "src/bin/mock_node.rs"

[[bin]]
name = "mock-node-crash"
path = "src/bin/mock_node_crash.rs"

[[bin]]
name = "mock-node-no-socket"
path = "src/bin/mock_node_no_socket.rs"

[[bin]]
name = "mock-wallet"
path = "src/bin/mock_wallet.rs"

[[bin]]
name = "mock-wallet-crash"
path = "src/bin/mock_wallet_crash.rs"

[[bin]]
name = "mock-mithril-client"
path = "src/bin/mock_mithril_client.rs"

[[bin]]
name = "mock-snapshot-converter"
path = "src/bin/mock_snapshot_converter.rs"

[[bin]]
name = "mock-node-crash-once"
path = "src/bin/mock_node_crash_once.rs"

[[bin]]
name = "mock-node-startup-log"
path = "src/bin/mock_node_startup_log.rs"

[[bin]]
name = "mock-mithril-client-fail"
path = "src/bin/mock_mithril_client_fail.rs"

[[bin]]
name = "mock-mithril-client-not-needed"
path = "src/bin/mock_mithril_client_not_needed.rs"

[[bin]]
name = "mock-snapshot-converter-fail"
path = "src/bin/mock_snapshot_converter_fail.rs"

[[bin]]
name = "mock-snapshot-converter-slow"
path = "src/bin/mock_snapshot_converter_slow.rs"

[[bin]]
name = "mock-snapshot-converter-sentinel"
path = "src/bin/mock_snapshot_converter_sentinel.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
file-rotate = "0.8"
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
